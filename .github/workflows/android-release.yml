name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.9.1)'
        required: true
        default: 'v1.9.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env file
        run: |
          cp .env.example .env 2>/dev/null || true
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Create debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed, optional)
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Build Release AAB (signed, optional)
        run: gradle bundleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "مدیریت ووکامرس ${{ steps.tag.outputs.tag }}"
          body: |
            ## مدیریت ووکامرس - نسخه ${{ steps.tag.outputs.tag }}

            ### ✨ قابلیت‌های جدید در این نسخه (۱.۹.۱):

            #### نمایش بهتر محصولات متغیر
            - **قیمت واریانت‌ها** – برای محصولات چند ویژگی، بازه قیمت «از X تا Y» نمایش داده می‌شود
            - **تعداد تنوع** – بج «X تنوع» روی کارت هر محصول متغیر
            - **موجودی کل واریانت‌ها** – جمع موجودی همه ترکیب‌ها با رنگ وضعیت
            - **خلاصه ویژگی‌ها** – نام رنگ‌ها و سایزها مستقیم روی کارت محصول

            #### نسخه ۱.۹.۰ (قبلی) — رابط کاربری ووکامرس
            - فیلتر چیپ‌های افقی وضعیت سفارش
            - انتخاب بازه زمانی در داشبورد
            - Pull-to-Refresh در داشبورد، سفارش‌ها و محصولات

            ---

            ### ویژگی‌های کامل اپ:
            - داشبورد هوشمند با KPI و نمودار فروش روزانه
            - مدیریت سفارش‌ها (وضعیت، پرداخت، رهگیری، فاکتور)
            - مدیریت محصولات با قیمت‌گذاری متغیر
            - مدیریت مشتریان با تاریخچه سفارش
            - گزارشات مالی (درآمد، توزیع وضعیت، پرفروش‌ها)
            - کوپن‌ها و مدیریت تخفیف
            - هوش مصنوعی Gemini برای تحلیل فروشگاه
            - پیامک ملی‌پیامک خودکار
            - مدیریت چند فروشگاهی
            - ورود بیومتریک (اثر انگشت/چهره)
            - تم تاریک/روشن و رابط کاربری فارسی کامل

            ---

            ### نصب APK:
            فایل `*-debug.apk` را دانلود کرده و روی گوشی اندروید نصب کنید.
            (در صورت نیاز، «نصب از منابع ناشناس» را در تنظیمات امنیتی گوشی فعال کنید)
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed Release APK (if available)
        run: |
          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            echo "Signed release APK found, would upload to release"
          else
            echo "No signed release APK (signing secrets not configured), skipping"
          fi
