name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.3.1'
          
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          
      - name: Generate debug keystore if release keystore is missing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            echo "Release keystore not found, generating debug keystore for CI..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass android \
              -keypass android \
              -dname "CN=CI, OU=Build, O=GitHub Actions, L=Unknown, S=Unknown, C=US"
          fi
          
      - name: Build Release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          
      - name: Build Release AAB (Bundle)
        run: gradle bundleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          
      - name: Upload artifacts to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "مدیریت ووکامرس v2.0" \
            --notes-file RELEASE_NOTES_v2.0.md \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            || gh release upload ${{ github.ref_name }} \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/bundle/release/*.aab
